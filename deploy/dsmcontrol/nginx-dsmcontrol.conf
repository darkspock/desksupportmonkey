# DSM Control — nginx configuration
# 3 server blocks: marketing site (www), React SPA (app), API proxy (api)

# --- Marketing website: www.dsmcontrol.com ---
server {
    listen 80;
    server_name dsmcontrol.com www.dsmcontrol.com;
    return 301 https://www.dsmcontrol.com$request_uri;
}

server {
    listen 443 ssl;
    server_name dsmcontrol.com;
    return 301 https://www.dsmcontrol.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/dsmcontrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsmcontrol.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    server_name www.dsmcontrol.com;

    ssl_certificate /etc/letsencrypt/live/dsmcontrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsmcontrol.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/dsmcontrol/web/site;
    index index.html;

    # Static assets caching
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect app routes to app subdomain
    location /auth/ {
        return 301 https://app.dsmcontrol.com$request_uri;
    }
    location /api/ {
        return 301 https://api.dsmcontrol.com$request_uri;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# --- React SPA: app.dsmcontrol.com ---
server {
    listen 80;
    server_name app.dsmcontrol.com;
    return 301 https://app.dsmcontrol.com$request_uri;
}

server {
    listen 443 ssl;
    server_name app.dsmcontrol.com;

    ssl_certificate /etc/letsencrypt/live/app.dsmcontrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dsmcontrol.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/dsmcontrol/web/app;
    index index.html;

    client_max_body_size 10M;

    # Vite build assets — immutable hashed filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — SPA calls /api/v1/* which must reach the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health endpoint (backend)
    location /health {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API + WebSocket: api.dsmcontrol.com ---
server {
    listen 80;
    server_name api.dsmcontrol.com;
    return 301 https://api.dsmcontrol.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.dsmcontrol.com;

    ssl_certificate /etc/letsencrypt/live/api.dsmcontrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dsmcontrol.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy
    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
