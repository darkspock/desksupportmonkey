# DeskSupportMonkey — nginx configuration
# 3 server blocks: marketing site, React SPA, API proxy

# --- Marketing website: desksupportmonkey.com ---
server {
    listen 80;
    server_name desksupportmonkey.com www.desksupportmonkey.com;
    return 301 https://desksupportmonkey.com$request_uri;
}

server {
    listen 443 ssl;
    server_name desksupportmonkey.com www.desksupportmonkey.com;

    ssl_certificate /etc/letsencrypt/live/desksupportmonkey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desksupportmonkey.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/dsm/web/site;
    index index.html;

    # Static assets caching
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect old app routes to app subdomain
    location /auth/ {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /api/ {
        return 301 https://api.desksupportmonkey.com$request_uri;
    }
    location /ws {
        return 301 https://api.desksupportmonkey.com$request_uri;
    }
    location /my/ {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /dashboard {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /requests {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /assets {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /users {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /departments {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /companies {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }
    location /reports {
        return 301 https://app.desksupportmonkey.com$request_uri;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# --- React SPA: app.desksupportmonkey.com ---
server {
    listen 80;
    server_name app.desksupportmonkey.com;
    return 301 https://app.desksupportmonkey.com$request_uri;
}

server {
    listen 443 ssl;
    server_name app.desksupportmonkey.com;

    ssl_certificate /etc/letsencrypt/live/app.desksupportmonkey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.desksupportmonkey.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/dsm/web/app;
    index index.html;

    # Vite build assets — immutable hashed filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API + WebSocket: api.desksupportmonkey.com ---
server {
    listen 80;
    server_name api.desksupportmonkey.com;
    return 301 https://api.desksupportmonkey.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.desksupportmonkey.com;

    ssl_certificate /etc/letsencrypt/live/api.desksupportmonkey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.desksupportmonkey.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
