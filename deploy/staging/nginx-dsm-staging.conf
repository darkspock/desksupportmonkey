# DeskSupportMonkey — Staging API nginx configuration
# API-only: proxies all requests to staging FastAPI on port 8003

# --- Staging API: staging.desksupportmonkey.com ---
server {
    listen 80;
    server_name staging.desksupportmonkey.com;
    return 301 https://staging.desksupportmonkey.com$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.desksupportmonkey.com;

    ssl_certificate /etc/letsencrypt/live/staging.desksupportmonkey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.desksupportmonkey.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
