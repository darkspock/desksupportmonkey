<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 11px;
            color: #333;
            padding: 40px;
        }
        .header {
            border-bottom: 3px solid #2563eb;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 20px;
            color: #1e3a5f;
            margin-bottom: 4px;
        }
        .header .company { font-size: 14px; color: #555; }
        .header .meta { font-size: 10px; color: #888; margin-top: 4px; }
        .section { margin-bottom: 24px; }
        .section h2 {
            font-size: 14px;
            color: #1e3a5f;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }
        .cards {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px 16px;
            text-align: center;
            min-width: 100px;
        }
        .card .value { font-size: 22px; font-weight: bold; color: #2563eb; }
        .card .label { font-size: 9px; color: #666; text-transform: uppercase; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }
        th {
            background: #f1f5f9;
            color: #475569;
            text-align: left;
            padding: 6px 8px;
            font-weight: 600;
            border-bottom: 2px solid #cbd5e1;
        }
        td {
            padding: 5px 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:nth-child(even) td { background: #f8fafc; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
        }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-gray { background: #f1f5f9; color: #475569; }
        .alert { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
        .alert-title { font-weight: 600; color: #991b1b; margin-bottom: 4px; }
        .footer {
            margin-top: 40px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            text-align: center;
            font-size: 9px;
            color: #999;
        }
        @page { size: A4; margin: 20mm; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ title }}</h1>
        <div class="company">{{ company_name }}</div>
        <div class="meta">Generated on {{ generated_at }} | DeskSupportMonkey</div>
    </div>

    {% block content %}{% endblock %}

    <div class="footer">
        Generated by DeskSupportMonkey &mdash; {{ generated_at }}
    </div>
</body>
</html>
